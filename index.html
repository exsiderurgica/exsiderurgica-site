<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>Exsiderurgica</title>
  <style>
    :root{--bg:#000;--fg:#fff;--muted:#5d5d5d;--line:#252525}
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;background:var(--bg);color:var(--fg)}
    body{font-family:Arial,Helvetica,sans-serif;display:flex;justify-content:center;padding:clamp(26px,5vw,64px) 18px 38px}
    main{width:min(980px,100%)}
    header{display:flex;justify-content:center;align-items:center;padding:4px 0 clamp(34px,6vw,64px)}
    .logo{display:block;width:min(680px,92vw);max-height:180px;object-fit:contain}
    .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
    .project{position:relative;min-height:138px;border:1px solid var(--line);color:var(--fg);text-decoration:none;overflow:hidden;display:flex;align-items:center;justify-content:center;text-align:center;padding:26px 28px;font-size:clamp(17px,2vw,24px);font-weight:700;letter-spacing:.08em;isolation:isolate;transition:color .22s ease,border-color .22s ease,transform .22s ease}
    .project::before{content:"";position:absolute;inset:0;background:#fff;transform:scaleY(0);transform-origin:bottom;transition:transform .28s cubic-bezier(.2,.75,.25,1);z-index:-1}
    .project:hover,.project:focus-visible{color:#000;border-color:#fff;transform:translateY(-2px);outline:none}
    .project:hover::before,.project:focus-visible::before{transform:scaleY(1)}
    .contact{display:flex;justify-content:center;padding-top:34px}
    .mail{width:58px;height:58px;border:1px solid var(--line);display:grid;place-items:center;color:#fff;text-decoration:none;transition:background .22s ease,color .22s ease,border-color .22s ease,transform .22s ease}
    .mail:hover,.mail:focus-visible{background:#fff;color:#000;border-color:#fff;transform:translateY(-2px);outline:none}
    .mail svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:square;stroke-linejoin:miter}
    footer{color:var(--muted);text-align:center;font-size:11px;letter-spacing:.18em;text-transform:uppercase;padding-top:24px}
    @media (max-width:640px){body{padding:26px 13px 30px}header{padding-bottom:30px}.grid{grid-template-columns:1fr;gap:9px}.project{min-height:102px;padding:20px 22px}}
    @media (prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important}}
  </style>
</head>
<body>
  <main>
    <header><img class="logo" src="exs-logo.svg" alt="EXS"></header>
    <section class="grid" aria-label="Progetti Exsiderurgica">
      <a class="project" href="https://www.youtube.com/@exsiderurgica" target="_blank" rel="noopener noreferrer">YOUTUBE</a>
      <a class="project" href="https://www.instagram.com/exsiderurgica/" target="_blank" rel="noopener noreferrer">INSTAGRAM</a>
      <a class="project" href="https://exsiderurgica.github.io/turing-groovebox-site/" target="_blank" rel="noopener noreferrer">TTG</a>
      <a class="project" href="https://exsiderurgica.github.io/LIRA8-ANDROID-SITE/" target="_blank" rel="noopener noreferrer">LIRA8</a>
      <a class="project" href="https://github.com/exsiderurgica/S4-Storage-site" target="_blank" rel="noopener noreferrer">S4 STORAGE</a>
      <a class="project" href="#" aria-label="Blattodea Records">BLATTODEA RECORDS</a>
    </section>
    <div class="contact">
      <a class="mail" href="mailto:exsiderurgica@gmail.com" aria-label="Scrivi a Exsiderurgica">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5.5" width="17" height="13"></rect><path d="M4 6l8 6 8-6"></path></svg>
      </a>
    </div>
    <footer>Exsiderurgica</footer>
  </main>
</body>
</html>
