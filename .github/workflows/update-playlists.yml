name: Update YouTube playlists
on:
  workflow_dispatch:
  schedule:
    - cron: '37 */6 * * *'
  push:
    paths:
      - 'scripts/update_playlists.py'
      - '.github/workflows/update-playlists.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install playlist reader
        run: python -m pip install --upgrade yt-dlp
      - name: Build playlist catalog
        run: python scripts/update_playlists.py
      - name: Commit catalog if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/playlists.json
          git diff --cached --quiet || git commit -m "chore: refresh YouTube playlist catalog"
          git push
