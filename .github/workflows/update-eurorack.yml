name: Update Eurorack catalog
on:
  workflow_dispatch:
  schedule:
    - cron: '7 */6 * * *'
  push:
    paths:
      - 'scripts/update_eurorack.py'
      - '.github/workflows/update-eurorack.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade yt-dlp
      - run: python scripts/update_eurorack.py
      - name: Commit catalog if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/eurorack.json
          git diff --cached --quiet || git commit -m "chore: refresh Eurorack catalog"
          git push
